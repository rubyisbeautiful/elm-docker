version: v1.0
name: elm-docker Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

blocks:

  - name: "Build"
    task:
      secrets:
        - name: dockerhub-secrets
      prologue:
        commands:
          - echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
      jobs:
        - name: Docker build
          env_vars:
            - name: ELM_VERSION
              value: "0.19.1"
          matrix:
            - env_var: NODE_VERSION
              values: ["22"]
            - env_var: ELM_TEST_VERSION
              values: ["0.19.1-revision6", "0.19.1-revision12"]
          commands:
            - checkout
            - |
              docker build \
                --build-arg NODE_VERSION=$NODE_VERSION \
                --build-arg ELM_VERSION=$ELM_VERSION \
                --build-arg ELM_TEST_VERSION=$ELM_TEST_VERSION \
                -t rubyisbeautiful/elm-docker:$NODE_VERSION-$ELM_VERSION-$ELM_TEST_VERSION \
                .
            - docker push rubyisbeautiful/elm-docker:$NODE_VERSION-$ELM_VERSION-$ELM_TEST_VERSION
